name: Build Docker App



on:

  push:

    branches:

      - main

      - develop

      - feature/**



jobs:

  build:

    runs-on: ubuntu-latest



    steps:
      - uses: actions/checkout@v4


      - name: Buiild Image
        run: docker build -t cloud-lab-app ./app

      - name: Run Container
        run: |
          docker run -d -p 5000:5000 --name app-test cloud-lab-app

      - name: Wait for App
        run: sleep 10

      - name: Test Application
        run: curl http://localhost:5000
