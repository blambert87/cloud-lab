name: Build and Publish



on:

  push:

    branches:

      - main

      - develop

      - feature/**



jobs:

  build:

    runs-on: ubuntu-latest



    permissions:

      contents: read

      packages: write



    steps:

      - uses: actions/checkout@v4



      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Build Image

        run: docker build -t ghcr.io/${{ github.repository_owner }}/cloud-lab-app:latest \

        ./app



      - name: Push Image

        run: docker push ghcr.io/${{ github.repository_owner }}/cloud-lab-app:latest
