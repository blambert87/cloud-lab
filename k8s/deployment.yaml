apiVersion: apps/v1

kind: Deployment

metadata:
  name: cloud-lab-app
  namespace: dev

spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-lab-app

  template:
    metadata:
      labels:
        app: cloud-lab-app

    spec:
      containers:
      - name: cloud-lab-app
        image: ghcr.io/blambert87/cloud-lab-app:latest

        resources:
         requests:
          cpu: "100m"
          memory: "128Mi"

         limits:
          cpu: "250m"
          memory: "256Mi"

        ports:
        - containerPort: 5000

        readinessProbe:
         httpGet:
          path: /
          port: 5000
         initialDelaySeconds: 5
         periodSeconds: 5

        livenessProbe:
         httpGet:
          path: /
          port: 5000
         initialDelaySeconds: 10
         periodSeconds: 10

        imagePullPolicy: Always
