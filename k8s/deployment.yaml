apiVersion: apps/v1

kind: Deployment

metadata:

  name: cloud-lab-app



spec:

  replicas: 2



  selector:

    matchLabels:

      app: cloud-lab-app



  template:

    metadata:

      labels:

        app: cloud-lab-app



    spec:

      containers:

      - name: cloud-lab-app

        image: ghcr.io/blambert87/cloud-lab-app:latest



        ports:

        - containerPort: 5000


        imagePullPolicy: Always
        
        resources:
          
          requests:

           cpu: "100m"
          
           memory: "128Mi"


          limits:
           cpu: "500m"
           memory: "512Mi"
