apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: cloud-lab-ingress

spec:
  ingressClassName: traefik

  rules:
  - host: cloudlab.local

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: cloud-lab-service

            port:
              number: 5000
